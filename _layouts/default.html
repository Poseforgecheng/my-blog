<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    {% include head.html %}
  </head>
  <body>
    <header class="zh-topbar">
      <div class="zh-topbar-inner">
        <a class="zh-logo" href="{{ '/' | relative_url }}">
          <span class="zh-logo-mark">{{ site.author.name | slice: 0, 1 }}</span>
          <span>科技笔记</span>
        </a>
        <nav class="zh-nav" aria-label="站点">
          <a
            href="{{ '/' | relative_url }}"
            {% if page.url == '/' or page.url == '/index.html' %}class="is-active" aria-current="page"{% endif %}
          >首页</a>
          <a
            href="{{ '/blog/' | relative_url }}"
            {% if page.url contains '/blog' or page.url contains '/notes' %}class="is-active" aria-current="page"{% endif %}
          >笔记</a>
          <a
            href="{{ '/games/' | relative_url }}"
            {% if page.url contains '/games' %}class="is-active" aria-current="page"{% endif %}
          >游戏</a>
          <a
            href="{{ '/about/' | relative_url }}"
            {% if page.url contains '/about' %}class="is-active" aria-current="page"{% endif %}
          >关于</a>
        </nav>
        <form class="zh-search" action="{{ '/blog/' | relative_url }}" method="get" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="2"></circle>
            <path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
          <input type="search" name="q" placeholder="搜索笔记" aria-label="搜索笔记" />
        </form>
        <a class="zh-btn zh-write-link" href="{{ '/write/' | relative_url }}">写笔记</a>
      </div>
    </header>
    <div class="zh-shell">
      <main class="zh-main">
        {{ content }}
      </main>
      {% include sidebar.html %}
    </div>
    <footer class="zh-footer">
      <span>© 2026 ChengzhuoSir</span>
      <a href="https://github.com/Poseforgecheng/my-blog" target="_blank" rel="noreferrer">GitHub</a>
    </footer>
    {% include scripts.html %}
  </body>
</html>
