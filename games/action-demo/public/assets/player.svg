<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <!-- Red Cape (Brighter & Longer/Wider) -->
  <!-- Starts wider at shoulders (5,20 / 59,20), flows down to near bottom (32, 62) with a wider curve -->
  <path d="M8,20 Q32,75 56,20 L32,5 Z" fill="#FF1744" stroke="#D50000" stroke-width="1"/>
  
  <!-- Staff (Ruyi Jingu Bang) - Brighter Red & Gold -->
  <rect x="50" y="2" width="6" height="60" fill="#FF1744" stroke="#B71C1C" stroke-width="1"/>
  <rect x="50" y="2" width="6" height="8" fill="#FFD700"/> <!-- Gold Tip Top -->
  <rect x="50" y="54" width="6" height="8" fill="#FFD700"/> <!-- Gold Tip Bottom -->

  <!-- Legs/Pants (Brighter Blue) -->
  <rect x="20" y="40" width="10" height="15" fill="#2962FF"/> <!-- Bright Blue Left -->
  <rect x="34" y="40" width="10" height="15" fill="#2962FF"/> <!-- Bright Blue Right -->
  <rect x="20" y="55" width="10" height="5" fill="#212121"/> <!-- Boots Left -->
  <rect x="34" y="55" width="10" height="5" fill="#212121"/> <!-- Boots Right -->

  <!-- Body/Armor (Brighter Gold) -->
  <rect x="18" y="25" width="28" height="20" rx="3" fill="#FFD700" stroke="#E65100" stroke-width="2"/> <!-- Bright Gold -->
  <circle cx="32" cy="35" r="4" fill="#FF1744"/> <!-- Chest Gem -->

  <!-- Head -->
  <circle cx="32" cy="16" r="12" fill="#D7CCC8"/> <!-- Face -->
  <ellipse cx="32" cy="18" rx="8" ry="6" fill="#FFAB91"/> <!-- Mask Area (Brighter) -->
  
  <!-- Face Details -->
  <circle cx="29" cy="16" r="2" fill="#000"/>
  <circle cx="35" cy="16" r="2" fill="#000"/>
  
  <!-- Golden Circlet (Brighter) -->
  <path d="M20,12 Q32,4 44,12" stroke="#FFFF00" stroke-width="3" fill="none"/>
  <rect x="30" y="8" width="4" height="4" fill="#FFFF00"/> 

  <!-- Tail -->
  <path d="M20,45 Q5,55 10,62" stroke="#8D6E63" stroke-width="3" fill="none"/>
</svg>