---
layout: default
title: 首页
description: "ChengzhuoSir 的科技笔记。"
---

<section class="zh-feed">
  <div class="zh-tabs">
    <a class="is-active" href="{{ '/' | relative_url }}">最新</a>
    <a href="{{ '/blog/' | relative_url }}">全部笔记</a>
    <a href="{{ '/notes/' | relative_url }}">本机笔记</a>
  </div>
  <p class="zh-search-label" data-search-label hidden></p>
  <div id="local-feed" data-local-feed></div>
  {% for post in site.posts limit: 10 %}
    {% include feed_card.html %}
  {% endfor %}
  {% if site.posts.size == 0 %}
  <p class="zh-empty">还没有公开笔记。可以先写一篇，或导入 Markdown / Word。</p>
  {% endif %}
  <p class="zh-end">没有更多了</p>
</section>
