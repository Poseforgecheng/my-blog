# Site settings
title: "ChengzhuoSir 的科技笔记"
description: "ChengzhuoSir 的科技笔记，记录工作与学习。"
lang: zh-CN
timezone: Asia/Shanghai

# URL settings (update for custom domain)
url: "https://chengzhuosir.github.io"
baseurl: "/my-blog"

# Author
author:
  name: "ChengzhuoSir"
  bio: "关注工程实践、产品体验与科技美学。"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - artifacts
  - tools
  - zaomeng_demo-master
  - node_modules
  - games/action-demo/node_modules
  - games/action-demo/src
  - games/action-demo/tsconfig.json
  - games/action-demo/vite.config.ts
  - games/action-demo/package.json
  - games/action-demo/package-lock.json
